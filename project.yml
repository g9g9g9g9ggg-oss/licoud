name: StarLink
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
targets:
  StarLink:
    type: application
    platform: iOS
    sources:
      - StarLink
    info:
      path: StarLink/Info.plist
      properties:
        CFBundleDisplayName: 星链
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starlink.ios
        PRODUCT_NAME: StarLink
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
  StarLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StarLinkTests
    dependencies:
      - target: StarLink
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/StarLink.app/StarLink
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  StarLink:
    build:
      targets:
        StarLink: all
        StarLinkTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - StarLinkTests
