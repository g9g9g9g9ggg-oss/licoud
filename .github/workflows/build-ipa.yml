name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      config:
        description: 'Build configuration: Release or Debug'
        required: false
        default: 'Release'
        type: string
      skip_tests:
        description: 'Skip simulator tests (dispatch only)'
        required: false
        default: 'false'
        type: string

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests (non-blocking, only on manual dispatch — simulator minutes bill 10x)
        if: github.event_name == 'workflow_dispatch' && inputs.skip_tests != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$UDID" ]; then echo "NO-IPHONE-SIM available:"; xcrun simctl list devices available; exit 1; fi
          echo "Using simulator UDID: $UDID (Xcode: $XC)"
          xcodebuild test \
            -project StarLink.xcodeproj \
            -scheme StarLink \
            -destination "platform=iOS Simulator,id=$UDID" \
            2>&1 | tee test-output.log

      - name: Build unsigned IPA
        run: |
          xcodebuild archive \
            -project StarLink.xcodeproj \
            -scheme StarLink \
            -configuration ${{ inputs.config || 'Release' }} \
            -destination 'generic/platform=iOS' \
            -archivePath build/StarLink.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          mkdir -p build/Payload
          cp -R "build/StarLink.xcarchive/Products/Applications/StarLink.app" build/Payload/
          cd build && zip -qry StarLink-unsigned.ipa Payload

      - name: Upload test log
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StarLink-unsigned-ipa
          path: build/StarLink-unsigned.ipa
